<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NEXUS personal command center">
  <title>Notes | NEXUS</title>
  <link rel="stylesheet" href="nexus.css">
</head>
<body>

<header class="site-header">
  <div class="container navbar">
    <a class="brand" href="index.html">NE<span>X</span>US</a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html">Dashboard</a>
      <a href="tasks.html">Tasks</a>
      <a href="goals.html">Goals</a>
      <a href="focus.html">Focus</a>
      <a href="analytics.html">Analytics</a>
      <a href="notes.html">Notes</a>
      <a href="planner.html">Planner</a>
      <a href="settings.html">Settings</a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="container">
    <header class="page-header">
      <div class="eyebrow">Knowledge</div>
      <h1>Notes</h1>
      <p>Capture ideas, learning notes and anything worth keeping.</p>
    </header>
    
<section class="grid dashboard-grid">
  <section class="card">
    <div class="card-title"><h2>Notes</h2><button class="btn primary" data-action="new-note">+ New Note</button></div>
    <div class="field"><label for="note-search">Search notes</label><input id="note-search" type="search" placeholder="Search notes..."></div>
    <ul class="list" style="margin-top:18px">
      <li class="list-item"><span><strong>JavaScript Arrays</strong><br><span class="muted">map, filter, find, sort...</span></span><button class="btn">Open</button></li>
      <li class="list-item"><span><strong>NEXUS Ideas</strong><br><span class="muted">Features to implement later.</span></span><button class="btn">Open</button></li>
    </ul>
  </section>
  <section class="card">
    <div class="card-title"><h2>New Note</h2></div>
    <form class="field" id="note-form">
      <label for="note-title">Title</label><input id="note-title" required>
      <label for="note-content">Content</label><textarea id="note-content"></textarea>
      <button class="btn primary" type="submit">Save Note</button>
    </form>
  </section>
</section>

  </div>
</main>

<footer class="site-footer">
  <div class="container"><i>NEXUS:</i>Never Miss Your Routine</div>
</footer>
<script src="app.js"></script>

</body>
</html>
