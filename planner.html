<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="NEXUS personal command center">
  <title>Planner | NEXUS</title>
  <link rel="stylesheet" href="nexus.css">
</head>
<body>

<header class="site-header">
  <div class="container navbar">
    <a class="brand" href="index.html">NE<span>X</span>US</a>
    <nav class="nav-links" aria-label="Main navigation">
      <a href="index.html">Dashboard</a>
      <a href="tasks.html">Tasks</a>
      <a href="goals.html">Goals</a>
      <a href="focus.html">Focus</a>
      <a href="analytics.html">Analytics</a>
      <a href="notes.html">Notes</a>
      <a class="active" href="planner.html">Planner</a>
      <a href="settings.html">Settings</a>
    </nav>
  </div>
</header>

<main class="page">
  <div class="container">
    <header class="page-header">
      <div class="eyebrow">Schedule</div>
      <h1>Planner</h1>
      <p>Organize your tasks and activities across your calendar.</p>
    </header>

    <div class="grid dashboard-grid">
      <!-- Calendar View Card -->
      <section class="card">
        <div class="card-title">
          <h2 id="calendar-month-year">Calendar</h2>
          <div class="actions">
            <button class="btn" data-action="prev-month" aria-label="Previous Month">&larr;</button>
            <button class="btn" data-action="today">Today</button>
            <button class="btn" data-action="next-month" aria-label="Next Month">&rarr;</button>
          </div>
        </div>
        <div class="calendar" id="calendar-grid">
          <!-- Calendar header and days are dynamically injected by JavaScript -->
        </div>
      </section>

      <!-- Today's & Scheduled Items Card -->
      <section class="card">
        <div class="card-title">
          <h2 id="selected-date-title">Today's Schedule</h2>
          <select id="planner-filter" class="form-control" style="width: auto;">
            <option value="all">All Items</option>
            <option value="event">Events</option>
            <option value="deadline">Deadlines</option>
          </select>
        </div>

        <!-- Add New Event / Deadline Form -->
        <form id="planner-form" class="form-grid" style="margin-top: 16px; margin-bottom: 20px;">
          <div class="field full">
            <input id="planner-title" type="text" placeholder="Add new activity or deadline..." required />
          </div>
          <div class="field">
            <select id="planner-type">
              <option value="event">Event</option>
              <option value="deadline">Deadline</option>
            </select>
          </div>
          <div class="field">
            <input id="planner-time" type="time" value="09:00" required />
          </div>
          <div class="field full">
            <button type="submit" class="btn primary" style="width: 100%;">+ Add Item</button>
          </div>
        </form>

        <!-- Dynamic List of Events -->
        <ul id="planner-list" class="list" style="margin-top: 12px;">
          <!-- Items dynamically populated via app.js -->
        </ul>
      </section>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="container"><i>NEXUS:</i> Never Miss Your Routine</div>
</footer>

<script src="app.js"></script>
</body>
</html>
